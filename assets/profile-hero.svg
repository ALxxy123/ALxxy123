<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="376" viewBox="0 0 1280 376" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Mubaraki — Software Engineer and Founder of ETRA</title>
  <desc id="desc">Dark editorial banner with purple accents, engineering typography, and an abstract connected product-system illustration.</desc>
